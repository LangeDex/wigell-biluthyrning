<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilar – Wigell Biluthyrning</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar__logo">
          <img
            src="images/KoncernLogga.png"
            alt="Wigell Biluthyrning logotyp"
            height="40"
          />
          <span>Wigell Biluthyrning</span>
        </div>

        <ul class="navbar__links">
          <li><a href="index.html">Hem</a></li>
          <li><a href="cars.html">Bilar</a></li>
          <li id="admin-link" style="display: none">
            <a href="admin.html">Admin</a>
          </li>
          <li id="my-bookings-link" style="display: none">
            <a href="my-bookings.html">Mina bokningar</a>
          </li>
        </ul>

        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
          <i class="bi bi-list"></i>
        </button>

        <div class="navbar__user">
          <button id="login-btn" onclick="openLoginModal()">
            <i class="bi bi-person-circle"></i>
          </button>

          <div id="user-menu" style="display: none">
            <button class="user-avatar" onclick="toggleUserDropdown()">
              <span id="avatar-letter"></span>
            </button>
            <div class="user-dropdown" id="user-dropdown" style="display: none">
              <p id="dropdown-username"></p>
              <a href="my-bookings.html"
                ><i class="bi bi-calendar-check"></i> Mina bokningar</a
              >
              <button onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Logga ut
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="cars-layout">
        <aside class="filter-sidebar">
          <h3>Filtrera & Sortera</h3>

          <div class="filter-group">
            <h4>Typ</h4>
            <label
              ><input type="checkbox" value="Sedan" onchange="applyFilters()" />
              Sedan</label
            >
            <label
              ><input type="checkbox" value="SUV" onchange="applyFilters()" />
              SUV</label
            >
            <label
              ><input type="checkbox" value="El" onchange="applyFilters()" />
              El</label
            >
            <label
              ><input
                type="checkbox"
                value="Pickup"
                onchange="applyFilters()"
              />
              Pickup</label
            >
          </div>

          <div class="filter-group">
            <h4>Pris</h4>
            <button class="btn btn--function" onclick="sortByPrice('asc')">
              Lågt → Högt
            </button>
            <button class="btn btn--function" onclick="sortByPrice('desc')">
              Högt → Lågt
            </button>
          </div>

          <div class="filter-group">
            <h4>Namn</h4>
            <button class="btn btn--function" onclick="sortCars('name', 'asc')">
              A → Ö
            </button>
            <button
              class="btn btn--function"
              onclick="sortCars('name', 'desc')"
            >
              Ö → A
            </button>
          </div>

          <button class="btn btn--negative" onclick="resetFilters()">
            Återställ
          </button>
        </aside>

        <section class="cars-section">
          <h2>Våra bilar</h2>
          <div id="cars-container"></div>
        </section>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cars.js"></script>
    <script>
      updateNavbar();
      loadCars();
    </script>

    <!-- Login Modal -->
    <div id="login-modal" style="display: none">
      <div class="modal-overlay" onclick="closeLoginModal()"></div>
      <div class="modal-card">
        <h2>Logga in</h2>
        <div id="modal-error" style="display: none">
          Fel användarnamn eller lösenord.
        </div>
        <div class="form-group">
          <label for="username">Användarnamn</label>
          <input type="text" id="username" placeholder="Ange användarnamn" />
        </div>
        <div class="form-group">
          <label for="password">Lösenord</label>
          <input type="password" id="password" placeholder="Ange lösenord" />
        </div>
        <button class="btn btn--positive btn--full" onclick="handleLogin()">
          Logga in
        </button>
      </div>
    </div>

    <script>
      function openLoginModal() {
        document.getElementById("login-modal").style.display = "block";
      }

      function closeLoginModal() {
        document.getElementById("login-modal").style.display = "none";
      }

      async function handleLogin() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("modal-error");

        const result = await login(username, password);

        if (result.success) {
          closeLoginModal();
          updateNavbar();
        } else {
          errorMsg.style.display = "block";
        }
      }

      function toggleUserDropdown() {
        const dropdown = document.getElementById("user-dropdown");
        dropdown.style.display =
          dropdown.style.display === "none" ? "block" : "none";
      }

      function toggleMenu() {
        document.querySelector(".navbar__links").classList.toggle("open");
      }
    </script>
  </body>
</html>
