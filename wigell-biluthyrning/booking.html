<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boka bil – Wigell Biluthyrning</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar__logo">
          <img
            src="images/KoncernLogga.png"
            alt="Wigell Biluthyrning logotyp"
            height="40"
          />
          <span>Wigell Biluthyrning</span>
        </div>

        <ul class="navbar__links">
          <li><a href="index.html">Hem</a></li>
          <li><a href="cars.html">Bilar</a></li>
          <li id="my-bookings-link" style="display: none">
            <a href="my-bookings.html">Mina bokningar</a>
          </li>
          <li id="admin-link" style="display: none">
            <a href="admin.html">Admin</a>
          </li>
        </ul>

        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
          <i class="bi bi-list"></i>
        </button>

        <div class="navbar__user">
          <button id="login-btn" onclick="openLoginModal()">
            <i class="bi bi-person-circle"></i>
          </button>

          <div id="user-menu" style="display: none">
            <button class="user-avatar" onclick="toggleUserDropdown()">
              <span id="avatar-letter"></span>
            </button>
            <div class="user-dropdown" id="user-dropdown" style="display: none">
              <p id="dropdown-username"></p>
              <a href="my-bookings.html"
                ><i class="bi bi-calendar-check"></i> Mina bokningar</a
              >
              <button onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Logga ut
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="booking-section">
        <h2>Boka bil</h2>
        <div id="car-info"></div>

        <form id="booking-form">
          <div class="form-group">
            <label for="from-date">Från datum</label>
            <input type="date" id="from-date" required />
          </div>

          <div class="form-group">
            <label for="to-date">Till datum</label>
            <input type="date" id="to-date" required />
          </div>

          <button type="submit" class="btn btn--positive">
            Bekräfta bokning
          </button>
          <a href="index.html" class="btn btn--negative">Avbryt</a>
        </form>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
    <script>
      function toggleMenu() {
        document.querySelector(".navbar__links").classList.toggle("open");
      }
      updateNavbar();
    </script>
  </body>
</html>
