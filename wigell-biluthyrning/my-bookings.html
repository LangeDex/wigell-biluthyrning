<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mina bokningar – Wigell Biluthyrning</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header style="position: relative">
      <nav class="navbar">
        <div class="navbar__logo">
          <img
            src="images/KoncernLogga.png"
            alt="Wigell Biluthyrning logotyp"
            height="40"
          />
          <span>Wigell Biluthyrning</span>
        </div>

        <ul class="navbar__links">
          <li><a href="index.html">Hem</a></li>
          <li><a href="cars.html">Bilar</a></li>
          <li id="my-bookings-link" style="display: none">
            <a href="my-bookings.html">Mina bokningar</a>
          </li>
          <li id="admin-link" style="display: none">
            <a href="admin.html">Admin</a>
          </li>
        </ul>

        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
          <i class="bi bi-list"></i>
        </button>

        <div class="navbar__user">
          <button id="login-btn" onclick="openLoginModal()">
            <i class="bi bi-person-circle"></i>
          </button>

          <div id="user-menu" style="display: none">
            <button class="user-avatar" onclick="toggleUserDropdown()">
              <span id="avatar-letter"></span>
            </button>
            <div class="user-dropdown" id="user-dropdown" style="display: none">
              <p id="dropdown-username"></p>
              <a href="my-bookings.html"
                ><i class="bi bi-calendar-check"></i> Mina bokningar</a
              >
              <a href="index.html#footer"
                ><i class="bi bi-telephone"></i> Kontakt</a
              >
              <button onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Logga ut
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="bookings-section">
        <h2>Mina bokningar</h2>
        <div id="bookings-container"></div>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
      requireLogin();

      if (isAdmin()) {
        document.getElementById("admin-link").style.display = "inline";
      }

      async function loadMyBookings() {
        const response = await fetch(`${API_BASE}/bookings/me`, {
          headers: getAuthHeader(),
        });
        const bookings = await response.json();
        const container = document.getElementById("bookings-container");

        if (bookings.length === 0) {
          container.innerHTML = "<p>Du har inga aktiva bokningar.</p>";
          return;
        }

        bookings.forEach((booking) => {
          const row = document.createElement("div");
          row.classList.add("booking-card");
          row.innerHTML = `
            <div class="booking-card__info">
              <p><strong>Bil ID:</strong> ${booking.carId}</p>
              <p><strong>Från:</strong> ${booking.fromDate}</p>
              <p><strong>Till:</strong> ${booking.toDate}</p>
              <p><strong>Status:</strong> ${booking.active ? "Aktiv" : "Avslutad"}</p>
            </div>
            <div class="booking-card__actions">
              <button class="btn btn--negative" onclick="cancelBooking(${booking.id})">
                Avboka
              </button>
              <div class="cancel-info">
                <i class="bi bi-info-circle"></i>
                <span>För avbokning, kontakta kundservice på <strong>060-123 45 67</strong> eller maila oss på <strong>info@wigell.se</strong> inom god tid.</span>
              </div>
            </div>
          `;
          container.appendChild(row);
        });
      }

      async function cancelBooking(bookingId) {
        if (!confirm("Är du säker på att du vill avboka?")) return;

        const response = await fetch(`${API_BASE}/bookings/${bookingId}`, {
          method: "DELETE",
          headers: getAuthHeader(),
        });

        if (response.ok) {
          alert("Bokning avbokad!");
          loadMyBookings();
        } else {
          alert("Du har inte behörighet att avboka. Kontakta kundservice.");
        }
      }

      function toggleMenu() {
        document.querySelector(".navbar__links").classList.toggle("open");
      }

      updateNavbar();
      loadMyBookings();
    </script>
  </body>
</html>
