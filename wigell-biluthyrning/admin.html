<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Wigell Biluthyrning</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar__logo">
          <img
            src="images/KoncernLogga.png"
            alt="Wigell Biluthyrning logotyp"
            height="40"
          />
          <span>Wigell Biluthyrning</span>
        </div>

        <ul class="navbar__links">
          <li><a href="index.html">Hem</a></li>
          <li><a href="cars.html">Bilar</a></li>
          <li><a href="admin.html">Admin</a></li>
        </ul>

        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
          <i class="bi bi-list"></i>
        </button>

        <div class="navbar__user">
          <button id="login-btn" onclick="openLoginModal()">
            <i class="bi bi-person-circle"></i>
          </button>

          <div id="user-menu" style="display: none">
            <button class="user-avatar" onclick="toggleUserDropdown()">
              <span id="avatar-letter"></span>
            </button>
            <div class="user-dropdown" id="user-dropdown" style="display: none">
              <p id="dropdown-username"></p>
              <a href="my-bookings.html"
                ><i class="bi bi-calendar-check"></i> Mina bokningar</a
              >
              <button onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Logga ut
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="admin-section">
        <h2>Adminpanel</h2>

        <!-- alla bokningar -->
        <div class="admin-block">
          <h3>Alla bokningar</h3>
          <table id="bookings-table">
            <thead>
              <tr>
                <th onclick="sortTable('bookings-table', 0)">ID</th>
                <th onclick="sortTable('bookings-table', 1)">Bil ID</th>
                <th onclick="sortTable('bookings-table', 2)">Användare ID</th>
                <th onclick="sortTable('bookings-table', 3)">Från</th>
                <th onclick="sortTable('bookings-table', 4)">Till</th>
                <th onclick="sortTable('bookings-table', 5)">Status</th>
                <th>Åtgärd</th>
              </tr>
            </thead>
            <tbody id="bookings-body"></tbody>
          </table>
        </div>

        <!-- alla användare -->
        <div class="admin-block">
          <h3>Alla användare</h3>
          <table id="users-table">
            <thead>
              <tr>
                <th onclick="sortTable('users-table', 0)">ID</th>
                <th onclick="sortTable('users-table', 1)">Användarnamn</th>
                <th onclick="sortTable('users-table', 2)">Email</th>
                <th onclick="sortTable('users-table', 3)">Roll</th>
                <th>Åtgärd</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>

        <!-- alla bilar -->
        <div class="admin-block">
          <h3>Alla bilar</h3>
          <table id="cars-table">
            <thead>
              <tr>
                <th onclick="sortTable('cars-table', 0)">ID</th>
                <th onclick="sortTable('cars-table', 1)">Namn</th>
                <th onclick="sortTable('cars-table', 2)">Typ</th>
                <th onclick="sortTable('cars-table', 3)">Pris</th>
                <th onclick="sortTable('cars-table', 4)">Status</th>
                <th>Åtgärd</th>
              </tr>
            </thead>
            <tbody id="cars-body"></tbody>
          </table>

          <!-- Lägg till bil -->
          <div class="admin-add-car">
            <h4>Lägg till bil</h4>
            <input type="text" id="car-name" placeholder="Namn" />
            <input type="text" id="car-model" placeholder="Modell" />
            <input type="text" id="car-type" placeholder="Typ" />
            <input type="number" id="car-price" placeholder="Pris" />
            <button class="btn btn--positive" onclick="addCar()">
              Lägg till
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
      function toggleMenu() {
        document.querySelector(".navbar__links").classList.toggle("open");
      }
      updateNavbar();
    </script>
  </body>
</html>
